name: VS Code host compatibility
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        version: ${{ fromJSON(github.event_name == 'schedule' && '["insiders"]' || '["1.95.0","stable"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release -- --tag "$RELEASE_TAG"
        shell: bash
      - name: Development and installed package smoke
        shell: bash
        env:
          HOST_VERSION: ${{ matrix.version }}
        run: |
          host() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node scripts/vscode-host.cjs "$@"
            else
              node scripts/vscode-host.cjs "$@"
            fi
          }
          host --version "$HOST_VERSION"
          host --version "$HOST_VERSION" --mode package
          if host --version "$HOST_VERSION" --mode package --force-failure; then
            echo "Forced host failure unexpectedly succeeded"
            exit 1
          fi
          node scripts/verify-host-failure.cjs
